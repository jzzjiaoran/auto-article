server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auto_article}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

app:
  crawler:
    # 热点定时采集 cron（默认每 30 分钟）；app.crawler.enabled=false 可停用定时任务
    enabled: ${APP_CRAWLER_ENABLED:true}
    cron: ${APP_CRAWLER_CRON:0 */30 * * * *}
  hot-topic:
    # 真实抓取无结果且库为空时，回退内置示例/种子数据
    fallback-sample-enabled: true
    # 全新环境启动时写入示例热点，保证列表与生成链路可用
    seed-on-start: true
  credentials:
    secret: ${CREDENTIALS_SECRET:auto-article-default-secret-key}
  llm:
    api-key: ${LLM_API_KEY:sk-placeholder}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    model: ${LLM_MODEL:gpt-3.5-turbo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
