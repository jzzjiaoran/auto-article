server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auto_article
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

app:
  credentials:
    secret: ${CREDENTIALS_SECRET:auto-article-default-secret-key}
  llm:
    api-key: ${LLM_API_KEY:sk-placeholder}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    model: ${LLM_MODEL:gpt-3.5-turbo}
