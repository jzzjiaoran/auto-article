<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>文章管理</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">文章管理</h1>
            <p class="text-muted mb-0">查看文章、编辑内容与管理发布状态</p>
        </div>
        <a th:href="@{/generate}" class="btn btn-primary mt-2 mt-sm-0">
            <i class="bi bi-stars me-1"></i>AI 生成文章
        </a>
    </div>

    <div th:replace="~{fragments/common :: flashMessages(${successMessage}, ${errorMessage})}"></div>

    <!-- 筛选 -->
    <div class="card mb-3">
        <div class="card-body py-3">
            <form th:action="@{/articles}" method="get" class="row g-2 align-items-end">
                <div class="col-12 col-md-4 col-lg-3">
                    <label for="keyword" class="form-label small mb-1">关键词</label>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="keyword" name="keyword" class="form-control"
                               th:value="${param.keyword != null ? param.keyword[0] : ''}" placeholder="搜索标题">
                    </div>
                </div>
                <div class="col-6 col-md-2 col-lg-2">
                    <label for="status" class="form-label small mb-1">状态</label>
                    <select id="status" name="status" class="form-select form-select-sm">
                        <option value="">全部状态</option>
                        <option value="draft" th:selected="${param.status != null and param.status[0] == 'draft'}">草稿</option>
                        <option value="generated" th:selected="${param.status != null and param.status[0] == 'generated'}">已生成</option>
                        <option value="published" th:selected="${param.status != null and param.status[0] == 'published'}">已发布</option>
                        <option value="failed" th:selected="${param.status != null and param.status[0] == 'failed'}">失败</option>
                    </select>
                </div>
                <div class="col-6 col-md-2 col-lg-2">
                    <label for="sort" class="form-label small mb-1">排序</label>
                    <select id="sort" name="sort" class="form-select form-select-sm">
                        <option value="createdAt,d" th:selected="${param.sort != null and param.sort[0] == 'createdAt,d'}">最新创建</option>
                        <option value="updatedAt,d" th:selected="${param.sort != null and param.sort[0] == 'updatedAt,d'}">最近更新</option>
                        <option value="wordCount,d" th:selected="${param.sort != null and param.sort[0] == 'wordCount,d'}">字数最多</option>
                    </select>
                </div>
                <div class="col-12 col-md-4 col-lg-3 d-flex gap-2">
                    <button type="submit" class="btn btn-sm btn-primary w-100">查询</button>
                    <a th:href="@{/articles}" class="btn btn-sm btn-outline-secondary w-100">重置</a>
                </div>
            </form>
        </div>
    </div>

    <!-- 文章列表 -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col" class="ps-3">标题</th>
                        <th scope="col">状态</th>
                        <th scope="col">字数</th>
                        <th scope="col">生成模型</th>
                        <th scope="col">更新时间</th>
                        <th scope="col" class="text-end pe-3">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="article : ${articles}">
                        <td class="ps-3">
                            <a th:href="@{/articles/{id}(id=${article.id})}"
                               class="text-decoration-none fw-medium" th:text="${article.title}">文章标题</a>
                        </td>
                        <td>
                            <span class="badge text-bg-secondary" th:if="${article.status == 'draft'}">草稿</span>
                            <span class="badge text-bg-info" th:if="${article.status == 'generated'}">已生成</span>
                            <span class="badge text-bg-success" th:if="${article.status == 'published'}">已发布</span>
                            <span class="badge text-bg-danger" th:if="${article.status == 'failed'}">失败</span>
                        </td>
                        <td th:text="${article.wordCount}">0</td>
                        <td class="small text-muted" th:text="${article.aiProvider ?: '--'}">--</td>
                        <td class="small text-muted" th:text="${#temporals.format(article.updatedAt, 'MM-dd HH:mm')}">--</td>
                        <td class="text-end pe-3 text-nowrap">
                            <a th:href="@{/articles/{id}/edit(id=${article.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i><span class="d-none d-md-inline ms-1">编辑</span>
                            </a>
                            <a th:href="@{/articles/{id}(id=${article.id})}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-eye"></i><span class="d-none d-md-inline ms-1">查看</span>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(articles)}">
                        <td colspan="6" class="text-center">
                            <th:block th:replace="~{fragments/common :: emptyState('暂无文章', '前往 AI 生成页面创建第一篇内容')}"></th:block>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2">
            <small class="text-muted">共 <span th:text="${total}">0</span> 条</small>
            <th:block th:if="${totalPages > 1}">
                <nav aria-label="文章列表分页">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${currentPage <= 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/articles(page=${currentPage - 1}, keyword=${param.keyword != null ? param.keyword[0] : ''}, status=${param.status != null ? param.status[0] : ''})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${p == currentPage ? 'active' : ''}">
                            <a class="page-link" th:href="@{/articles(page=${p}, keyword=${param.keyword != null ? param.keyword[0] : ''}, status=${param.status != null ? param.status[0] : ''})}"
                               th:text="${p + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/articles(page=${currentPage + 1}, keyword=${param.keyword != null ? param.keyword[0] : ''}, status=${param.status != null ? param.status[0] : ''})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </th:block>
        </div>
    </div>
</th:block>
</body>
</html>
