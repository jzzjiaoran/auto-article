<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>页面不存在</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="card p-5 text-center mx-auto" style="max-width: 480px;">
        <div class="display-1 fw-bold text-muted">404</div>
        <h1 class="h4 mt-3 mb-2">页面不存在</h1>
        <p class="text-muted mb-4">你访问的页面可能已被移除或地址有误。</p>
        <a th:href="@{/}" class="btn btn-primary mx-auto">
            <i class="bi bi-house me-1"></i>返回首页
        </a>
    </div>
</th:block>
</body>
</html>
