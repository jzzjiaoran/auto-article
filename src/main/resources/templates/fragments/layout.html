<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title layout:title-pattern="$CONTENT_TITLE · auto-article">auto-article</title>
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%9F%3C/text%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm" aria-label="主导航">
    <div class="container-fluid px-lg-4">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-pencil-square"></i>
            <span>auto-article</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" th:classappend="${#httpServletRequest.requestURI == '/' ? ' active' : ''}">
                        <i class="bi bi-speedometer2 me-1"></i>首页
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/hot-topics}"
                       th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/hot-topics') ? ' active' : ''}">
                        <i class="bi bi-fire me-1"></i>热点管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/articles}"
                       th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/articles') ? ' active' : ''}">
                        <i class="bi bi-file-earmark-text me-1"></i>文章管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/generate}"
                       th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/generate') ? ' active' : ''}">
                        <i class="bi bi-stars me-1"></i>AI 生成
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/platform-accounts}"
                       th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/platform-accounts') ? ' active' : ''}">
                        <i class="bi bi-columns-gap me-1"></i>平台管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/publish-records}"
                       th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/publish-records') ? ' active' : ''}">
                        <i class="bi bi-send me-1"></i>发布管理
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="#" th:title="'当前时间：' + ${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm')}">
                        <i class="bi bi-clock me-1"></i>
                        <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">2026-01-01</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="flex-grow-1">
    <div class="container-fluid px-3 px-lg-4 py-4">
        <!-- 页面内容 -->
        <th:block layout:fragment="content">
        </th:block>
    </div>
</main>

<footer class="bg-light border-top py-3 mt-auto">
    <div class="container-fluid px-3 px-lg-4 d-flex flex-wrap justify-content-between align-items-center text-muted small">
        <span>© <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> auto-article · AI 自动文章生成与发布平台</span>
        <span class="d-none d-sm-inline">Spring Boot · Thymeleaf</span>
    </div>
</footer>

<div id="global-alert-container" class="toast-container position-fixed top-0 end-0 p-3" aria-live="polite"></div>

<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- 通用前端脚本（toast、表单校验辅助） -->
<script th:src="@{/js/app.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
