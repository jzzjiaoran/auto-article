spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  hot-topic:
    collect:
      enabled: false
      cron: "0 0 * * * *"
      crawler-enabled: false
      fallback-sample-enabled: true
    seed-on-start: false
  llm:
    api-key: test-key
    base-url: http://localhost:9999
    model: test-model
